[package]
name = "sensend"
version = "0.5.4"
description = "Sensend - 超轻量级桌面悬浮记事本"
authors = ["简乐 <jloft198479@gmail.com>"]
license = "MIT"
repository = "https://github.com/jloft198479-cyber/sensend"
edition = "2021"

[lib]
name = "sensend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-global-shortcut = "2.3.1"
# 应用内自动更新（updater.rs 提供代理探测，前端 useUpdater 驱动检查/下载/安装）
tauri-plugin-updater = "2"
log = "0.4"
# 日志后端：接入后 log:: 调用才真正有输出（文件滚动 + dev stdout），线上可排障
tauri-plugin-log = "2"
base64 = "0.21"

# Windows 专用依赖：凭证加密 DPAPI + 更新代理探测（读注册表）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
winreg = "0.55"
